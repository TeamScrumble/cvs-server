name: Spring Boot 애플리케이션 빌드 및 배포

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy server'
        required: true
        type: choice
        options:
        - manual-deploy
        - total-deploy
  pull_request_review:
    types: [submitted]

jobs:
  gradle-build:
    runs-on: build-runner
    if: |
      ${{ 
        (github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
      }}
    steps:
    - name: 소스 코드 체크아웃
      uses: actions/checkout@v4

    - name: JDK 21 설정
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Gradle 실행 권한 부여
      run: chmod +x gradlew

    - name: Gradle로 빌드
      run: ./gradlew bootJar --parallel --build-cache --no-daemon

    - name: 빌드 결과물 업로드
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: build/libs/*.jar
        retention-days: 1

  docker-build:
    runs-on: build-runner
    needs: gradle-build
    if: |
      ${{ 
        inputs.deploy_target == 'total-deploy' ||
        (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
      }}
    steps:
    - name: 소스 코드 체크아웃
      uses: actions/checkout@v4

    - name: 빌드 결과물 다운로드
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: build/libs

    - name: Docker 레지스트리 로그인
      run: |
        echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | \
        docker login registry.scrumble.kro.kr -u "${{ secrets.DOCKER_REGISTRY_USERNAME }}" --password-stdin

    - name: Docker 이미지 빌드
      run: |
        docker build \
          --cache-from registry.scrumble.kro.kr/spring-app:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t registry.scrumble.kro.kr/spring-app:latest \
          -t registry.scrumble.kro.kr/spring-app:${{ github.sha }} \
          .

    - name: Docker 이미지 푸시
      run: |
        docker push registry.scrumble.kro.kr/spring-app:latest
        docker push registry.scrumble.kro.kr/spring-app:${{ github.sha }}

    - name: 로그아웃
      if: always()
      run: docker logout registry.scrumble.kro.kr