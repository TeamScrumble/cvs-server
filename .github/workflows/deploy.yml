name: Spring Boot 애플리케이션 빌드 및 빌드 서버 도커 배포

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy server'
        required: true
        type: choice
        options:
        - manual-deploy
        - total-deploy
  pull_request:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  gradle-build:
    runs-on: build-runner
    if: 
      ${{ inputs.deploy_target == 'total-deploy' || 
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
    steps:
    - name: 소스 코드 체크아웃
      uses: actions/checkout@v4

    - name: JDK 23 설정
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: gradle

    - name: Gradle 캐시 설정
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Gradle 실행 권한 부여
      run: chmod +x gradlew

    - name: Gradle로 빌드
      run: ./gradlew bootJar --parallel --build-cache

    - name: 빌드 결과물 업로드
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: build/libs/*.jar


