name: Spring Boot 애플리케이션 빌드 및 배포

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy server'
        required: true
        type: choice
        options:
        - manual-deploy
        - total-deploy
  pull_request_review:
    types: [submitted]

jobs:
  gradle-build:
    runs-on: build-runner
    if: |
      ${{ 
        (github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
      }}
    steps:
    - name: 소스 코드 체크아웃
      uses: actions/checkout@v4

    - name: JDK 21 설정
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Gradle 실행 권한 부여
      run: chmod +x gradlew

    - name: Gradle로 빌드
      run: ./gradlew bootJar --parallel --build-cache --no-daemon

    - name: 빌드 결과물 업로드
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: build/libs/*.jar
        retention-days: 1

  docker-build:
    runs-on: build-runner
    needs: gradle-build
    if: |
      ${{ 
        inputs.deploy_target == 'total-deploy' ||
        (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
      }}
    steps:
    - name: 소스 코드 체크아웃
      uses: actions/checkout@v4

    - name: 빌드 결과물 다운로드
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: build/libs

    - name: Docker 레지스트리 로그인
      run: |
        echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | \
        docker login registry.scrumble.kro.kr -u "${{ secrets.DOCKER_REGISTRY_USERNAME }}" --password-stdin

    - name: Docker 이미지 빌드
      run: |
        docker build \
          --cache-from registry.scrumble.kro.kr/spring-app:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t registry.scrumble.kro.kr/spring-app:latest \
          -t registry.scrumble.kro.kr/spring-app:${{ github.sha }} \
          .

    - name: Docker 이미지 푸시
      run: |
        docker push registry.scrumble.kro.kr/spring-app:latest
        docker push registry.scrumble.kro.kr/spring-app:${{ github.sha }}

    - name: 로그아웃
      if: always()
      run: docker logout registry.scrumble.kro.kr

  docker-deploy-manual:
    runs-on: deploy-runner
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'manual-deploy'
    steps:
    - name: 도커 이미지 가져오기
      run: docker pull localhost:5000/spring-app:latest

    - name: 기존 컨테이너 중지 및 삭제 (있을 경우)
      run: |
        docker stop spring-app || true
        docker rm spring-app || true

    - name: 새 컨테이너 실행
      run: |
        docker run -d \
          --name spring-app \
          --network scrumble \
          -p 9909:8080 \
          -e SPRING_PROFILES_ACTIVE=production \
          localhost:5000/spring-app:latest

  docker-deploy-total:
    runs-on: deploy-runner
    needs: docker-build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'total-deploy'
    steps:
    - name: 도커 이미지 가져오기
      run: docker pull localhost:5000/spring-app:latest

    - name: 기존 컨테이너 중지 및 삭제 (있을 경우)
      run: |
        docker stop spring-app || true
        docker rm spring-app || true

    - name: 새 컨테이너 실행
      run: |
        docker run -d \
          --name spring-app \
          --network scrumble \
          -p 9909:8080 \
          -e SPRING_PROFILES_ACTIVE=production \
          localhost:5000/spring-app:latest

  notify-discord-on-pr-and-approve:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    steps:
      - name: 디스코드로 PR/승인 알림 전송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_USER: ${{ github.event.review.user.login }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request_review" ] && [ "$REVIEW_STATE" = "approved" ]; then
            MESSAGE="**Pull Request가 승인되었습니다!**\n제목: $PR_TITLE\n\n내용: $PR_BODY\n\n링크: $PR_URL\n승인자: $REVIEW_USER"
          else
            MESSAGE="**새 Pull Request가 열렸습니다!**\n제목: $PR_TITLE\n\n내용: $PR_BODY\n\n링크: $PR_URL"
          fi
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"$MESSAGE\"}" \
            $DISCORD_WEBHOOK_URL                     