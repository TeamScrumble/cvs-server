spring:
  application:
    name: crawler-service
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

springdoc:
  api-docs:
    path: /api/crawler/oas.json
  writer-with-default-pretty-printer: true