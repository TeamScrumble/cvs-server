<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Documentations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        :root {
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --border: #e5e7eb;
            --primary: #232f3e;
            --primary-hover: #4338ca;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .card-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .card-btn {
            display: inline-block;
            padding: 8px 14px;
            background: var(--primary);
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .card-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="title">Pyunpyun Documentation</h1>
    <p class="subtitle">서비스의 API / 에러 코드 / 이벤트 문서를 한 곳에서 확인할 수 있습니다.</p>

    <div class="card-grid">

        <!-- API Docs -->
        <div class="card">
            <div class="card-title">API Docs</div>
            <div class="card-desc">
                API 스펙을 통합한 Swagger UI 문서입니다.
            </div>
            <a href="/docs/api/index.html" class="card-btn">Open API Docs</a>
        </div>

        <!-- Error Docs -->
        <div class="card">
            <div class="card-title">Error Codes</div>
            <div class="card-desc">
                API 호출 시 발생할 수 있는 모든 에러 코드들을 정리한 문서입니다.
            </div>
            <a href="/docs/error/index.html" class="card-btn">Open Error Docs</a>
        </div>
    </div>
</div>
</body>
</html>
