<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>[Internal] Error Codes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        :root {
            --bg: #f5f5f5;
            --bg-content: #ffffff;
            --primary: #49cc90;
            --primary-dark: #289d68;
            --text-main: #333;
            --text-muted: #777;
            --border: #e0e0e0;
            --code-bg: #2d2d2d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
        }

        /* 상단 헤더 (Swagger UI 상단바 비슷) */
        .doc-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background-color: #232f3e;
            color: #fff;
        }

        .doc-topbar-left {
            display: flex;
            flex-direction: column;
        }

        .doc-topbar-title {
            font-size: 18px;
            font-weight: 600;
        }

        .doc-topbar-subtitle {
            font-size: 13px;
            color: #d1d5db;
        }

        .doc-topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: #9ca3af;
        }

        .doc-nav-links {
            display: flex;
            gap: 8px;
        }

        .doc-nav-link {
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.25);
            font-size: 12px;
            color: #e5e7eb;
            text-decoration: none;
            background-color: rgba(15,23,42,0.25);
        }

        .doc-nav-link:hover {
            background-color: rgba(15,23,42,0.45);
        }

        .badge {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 6px;
            border-radius: 999px;
            font-size: 11px;
            border: 1px solid rgba(255,255,255,0.2);
            color: #e5e7eb;
        }

        /* 메인 레이아웃 */
        .layout {
            display: flex;
            min-height: calc(100vh - 52px);
        }

        /* 사이드바 */
        .sidebar {
            width: 260px;
            border-right: 1px solid var(--border);
            background-color: #fafafa;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .search-box {
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-size: 13px;
        }

        .category-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .category-item {
            margin-bottom: 4px;
        }

        .category-link {
            display: block;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 13px;
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
        }

        .category-link:hover {
            background-color: #e5e7eb;
        }

        .category-link.active {
            background-color: var(--primary);
            color: #fff;
        }

        .filter-info {
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 오른쪽 콘텐츠 */
        .content {
            flex: 1;
            padding: 24px 32px;
            overflow-x: auto;
        }

        .content-header {
            margin-bottom: 16px;
        }

        .content-title {
            font-size: 24px;
            margin: 0 0 4px;
        }

        .content-subtitle {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .chips {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            border: 1px solid var(--border);
            background-color: #f9fafb;
            color: var(--text-muted);
        }

        .group-card {
            margin-bottom: 24px;
            border-radius: 6px;
            background-color: var(--bg-content);
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .group-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .group-name {
            font-size: 16px;
            font-weight: 600;
        }

        .group-count {
            font-size: 12px;
            color: var(--text-muted);
        }

        .group-body {
            padding: 12px 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background-color: #f9fafb;
        }

        th, td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: top;
        }

        th {
            font-weight: 600;
            font-size: 12px;
            color: var(--text-muted);
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }

        .code-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: var(--code-bg);
            color: #f9fafb;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 11px;
        }

        .description-text {
            white-space: pre-wrap;
        }

        .error-box {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 4px;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .content {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
<div class="doc-topbar">
    <div class="doc-topbar-left">
        <div class="doc-topbar-title">[Internal] Error Codes</div>
        <div class="doc-topbar-subtitle">Document for Error Codes</div>
    </div>

    <div class="doc-topbar-right">
        <div class="doc-nav-links">
            <a class="doc-nav-link" href="/docs/index.html">Home</a>
            <a class="doc-nav-link" href="/docs/internal/api/index.html">API Docs</a>
            <a class="doc-nav-link" href="/docs/internal/error/index.html">Error Docs</a>
            <a class="doc-nav-link" href="/docs/internal/event/index.html">Event Docs</a>
        </div>
        <div>from <span class="badge">/error.json</span></div>
    </div>
</div>

<div class="layout">
    <!-- 사이드바 -->
    <aside class="sidebar">
        <div>
            <div class="sidebar-title">Filter</div>
            <div class="search-box">
                <input
                        id="search-input"
                        type="text"
                        class="search-input"
                        placeholder="코드 / 설명 검색 (예: A_001, 회원)"
                />
                <div class="filter-info" id="filter-info"></div>
            </div>

            <div class="sidebar-title">Groups</div>
            <ul class="category-list" id="category-list">
                <!-- JS로 채워짐 -->
            </ul>
        </div>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="content">
        <header class="content-header">
            <h1 class="content-title">Error Code Reference</h1>
            <p class="content-subtitle">
                서비스 전역에서 사용하는 비즈니스/시스템 에러 코드 목록입니다.
            </p>
            <div class="chips" id="summary-chips"></div>
        </header>

        <div id="error-container"></div>
        <div id="error-message" class="error-box" style="display:none;"></div>
    </main>
</div>

<script>
    const ERRORS_URL = '/error.json'; // 서버 엔드포인트

    const errorContainer = document.getElementById('error-container');
    const categoryList = document.getElementById('category-list');
    const searchInput = document.getElementById('search-input');
    const filterInfo = document.getElementById('filter-info');
    const summaryChips = document.getElementById('summary-chips');
    const errorMsgBox = document.getElementById('error-message');

    let rawData = {};
    let currentFilter = '';
    let currentGroup = null;

    async function loadErrors() {
        try {
            const res = await fetch(ERRORS_URL);
            if (!res.ok) {
                throw new Error(`HTTP ${res.status}`);
            }
            const json = await res.json();
            rawData = json;

            buildSidebar(json);
            renderSummary(json);
            renderGroups(json);
        } catch (e) {
            showError(`에러 코드를 불러오지 못했습니다: ${e.message}`);
        }
    }

    function showError(message) {
        errorMsgBox.style.display = 'block';
        errorMsgBox.textContent = message;
    }

    function clearError() {
        errorMsgBox.style.display = 'none';
        errorMsgBox.textContent = '';
    }

    function buildSidebar(data) {
        categoryList.innerHTML = '';

        const groupNames = Object.keys(data);
        if (groupNames.length === 0) return;

        groupNames.forEach((groupName, idx) => {
            const li = document.createElement('li');
            li.className = 'category-item';

            const a = document.createElement('a');
            a.className = 'category-link';
            a.textContent = `${groupName} (${data[groupName].length})`;
            a.href = 'javascript:void(0)';
            a.dataset.group = groupName;

            if (idx === 0) {
                a.classList.add('active');
                currentGroup = groupName;
            }

            a.addEventListener('click', () => {
                document
                    .querySelectorAll('.category-link')
                    .forEach(el => el.classList.remove('active'));
                a.classList.add('active');
                currentGroup = groupName;
                renderGroups(rawData);
                scrollToGroup(groupName);
            });

            li.appendChild(a);
            categoryList.appendChild(li);
        });
    }

    function renderSummary(data) {
        const groupNames = Object.keys(data);
        const totalGroups = groupNames.length;
        const totalErrors = groupNames.reduce((sum, g) => sum + data[g].length, 0);

        summaryChips.innerHTML = '';

        const chip1 = document.createElement('div');
        chip1.className = 'chip';
        chip1.textContent = `Groups: ${totalGroups}`;
        summaryChips.appendChild(chip1);

        const chip2 = document.createElement('div');
        chip2.className = 'chip';
        chip2.textContent = `Total Codes: ${totalErrors}`;
        summaryChips.appendChild(chip2);
    }

    function renderGroups(data) {
        clearError();
        const keyword = currentFilter.trim().toLowerCase();
        const groupNames = Object.keys(data);

        errorContainer.innerHTML = '';

        groupNames.forEach(groupName => {
            const items = data[groupName] || [];

            const filtered = items.filter(item => {
                if (!keyword) return true;
                const code = (item.code || '').toLowerCase();
                const desc = (item.description || '').toLowerCase();
                return code.includes(keyword) || desc.includes(keyword);
            });

            if (filtered.length === 0) return;

            const card = document.createElement('section');
            card.className = 'group-card';
            card.id = `group-${groupName}`;

            const header = document.createElement('div');
            header.className = 'group-header';

            const nameDiv = document.createElement('div');
            nameDiv.className = 'group-name';
            nameDiv.textContent = groupName;

            const countDiv = document.createElement('div');
            countDiv.className = 'group-count';
            countDiv.textContent = `${filtered.length} codes`;

            header.appendChild(nameDiv);
            header.appendChild(countDiv);

            const body = document.createElement('div');
            body.className = 'group-body';

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            thead.innerHTML = `
                <tr>
                    <th style="width: 180px;">Code</th>
                    <th>Description</th>
                </tr>
            `;

            const tbody = document.createElement('tbody');

            filtered.forEach(item => {
                const tr = document.createElement('tr');

                const tdCode = document.createElement('td');
                const codeBadge = document.createElement('span');
                codeBadge.className = 'code-badge';
                codeBadge.textContent = item.code || '';
                tdCode.appendChild(codeBadge);

                const tdDesc = document.createElement('td');
                const desc = document.createElement('div');
                desc.className = 'description-text';
                desc.textContent = item.description || '';
                tdDesc.appendChild(desc);

                tr.appendChild(tdCode);
                tr.appendChild(tdDesc);
                tbody.appendChild(tr);
            });

            table.appendChild(thead);
            table.appendChild(tbody);
            body.appendChild(table);

            card.appendChild(header);
            card.appendChild(body);
            errorContainer.appendChild(card);
        });

        filterInfo.textContent = keyword ? `필터: "${keyword}"` : '';
    }

    function scrollToGroup(groupName) {
        const el = document.getElementById(`group-${groupName}`);
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    searchInput.addEventListener('input', (e) => {
        currentFilter = e.target.value || '';
        renderGroups(rawData);
    });

    loadErrors();
</script>
</body>
</html>
